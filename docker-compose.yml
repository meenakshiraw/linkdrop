
services:
  postgres:
    image: postgres:16
    container_name: linkdrop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkdrop
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: linkdrop
    ports:
      - "5432:5432"
    volumes:
      - linkdrop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkdrop -d linkdrop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  linkdrop_pgdata:
